# ════════════════════════════════════════════════════════════════════════
#  SilinaTV Pro — Release Signing Configuration
#  ════════════════════════════════════════════════════════════════════════
#  Read by app/build.gradle.kts to configure the `release` signingConfig.
#  This file holds the credentials for silina-release.keystore so a signed,
#  installable release APK (SilinaTV-pro.apk) can be produced with:
#
#      ./gradlew assembleRelease
#
#  NOTE: Do NOT commit this file to a public repository — it contains the
#  private signing credentials of the release key. Keep it private.
# ════════════════════════════════════════════════════════════════════════
storeFile=../silina-release.keystore
storePassword=silinatvpro
keyAlias=silina-release
keyPassword=silinatvpro
