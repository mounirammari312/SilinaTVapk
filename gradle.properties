# Tuned for a 4GB / 2-core build box (proven safe on low-memory machines)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false
android.enableR8.fullMode=false
kotlin.compiler.execution.strategy=in-process
ksp.useKSP2=false

# full JDK for Gradle (JRE-only system java can't compile)
org.gradle.java.home=/home/z/jdk21
